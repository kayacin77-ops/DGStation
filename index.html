<style>
*{box-sizing:border-box}
html,body{margin:0;background:#050505;min-height:100%;font-family:Arial,sans-serif}
body{
  background:
    radial-gradient(circle at 15% 8%,rgba(231,183,70,.12),transparent 28%),

}
.shell{display:flex;justify-content:center;padding:clamp(0px,2vw,24px)}
.page{
  width:min(100%,1024px);
  position:relative;
  margin:auto;
  overflow:hidden;
  background:#050505;
  box-shadow:0 25px 80px rgba(0,0,0,.55);
}
.poster{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}

.hotspot{
  position:absolute;
  display:block;
  border-radius:14px;
  -webkit-tap-highlight-color:transparent;
  outline:none;
  isolation:isolate;
}

/* LIVE / GLOW effect */
.hotspot::before{
  content:"";
  position:absolute;
  inset:-2px;
  border-radius:inherit;
  pointer-events:none;
  opacity:.80;
  border:1px solid rgba(255,213,105,.55);
  box-shadow:
    0 0 6px rgba(255,200,70,.55),
    0 0 14px rgba(255,175,30,.32),
    inset 0 0 12px rgba(255,210,90,.12);
  animation:dgPulse 2.15s ease-in-out infinite;
}
.hotspot::after{
  content:"";
  position:absolute;
  left:8%;right:8%;top:-1px;height:2px;
  border-radius:999px;
  pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,245,190,.95),transparent);
  filter:drop-shadow(0 0 7px rgba(255,205,70,.95));
  opacity:.72;
  animation:dgScan 2.8s ease-in-out infinite;
}
@keyframes dgPulse{
  0%,100%{opacity:.50;filter:brightness(.95)}
  50%{opacity:1;filter:brightness(1.22)}
}
@keyframes dgScan{
  0%,100%{transform:translateX(-16%);opacity:.35}
  50%{transform:translateX(16%);opacity:.95}
}
.hotspot:active::before,
.hotspot:focus-visible::before{
  border-color:#fff0a2;
  box-shadow:
    0 0 8px #ffe07c,
    0 0 22px rgba(255,188,37,.85),
    0 0 38px rgba(255,156,0,.45),
    inset 0 0 18px rgba(255,228,133,.25);
  opacity:1;
}
@media(hover:hover) and (pointer:fine){
  .hotspot:hover::before{
    border-color:#fff2a8;
    box-shadow:
      0 0 8px #ffe47f,
      0 0 22px rgba(255,190,40,.85),
      0 0 40px rgba(255,153,0,.40),
      inset 0 0 18px rgba(255,220,100,.22);
    opacity:1;
  }
}

/* Different color accents by service */
.wa::before,.wechat::before{
  border-color:rgba(81,255,132,.62);
  box-shadow:0 0 7px rgba(54,255,111,.6),0 0 18px rgba(30,220,90,.32),inset 0 0 12px rgba(70,255,120,.12);
}
.tgcs::before,.tgch::before{
  border-color:rgba(77,191,255,.7);
  box-shadow:0 0 7px rgba(57,185,255,.68),0 0 18px rgba(0,138,255,.35),inset 0 0 12px rgba(70,185,255,.12);
}
.tiktok::before{border-color:rgba(255,72,135,.7);box-shadow:0 0 7px rgba(255,48,120,.65),0 0 18px rgba(255,30,105,.32)}
.fb::before{border-color:rgba(67,130,255,.72);box-shadow:0 0 7px rgba(70,130,255,.7),0 0 18px rgba(50,90,255,.32)}
.x::before{border-color:rgba(225,225,225,.62);box-shadow:0 0 7px rgba(255,255,255,.48),0 0 18px rgba(180,180,180,.22)}
