<style>
*{box-sizing:border-box}
html,body{margin:0;background:#050505;min-height:100%;font-family:Arial,sans-serif}
body{
  background:
    radial-gradient(circle at 15% 8%,rgba(231,183,70,.12),transparent 28%),
    radial-gradient(circle at 85% 12%,rgba(47,111,255,.10),transparent 25%),
    #050505;
}
.shell{display:flex;justify-content:center;padding:clamp(0px,2vw,24px)}
.page{
  width:min(100%,1024px);
  position:relative;
  margin:auto;
  overflow:hidden;
  background:#050505;
  box-shadow:0 25px 80px rgba(0,0,0,.55);
}
.poster{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}

.hotspot{
  position:absolute;
  display:block;
  border-radius:14px;
  -webkit-tap-highlight-color:transparent;
  outline:none;
  isolation:isolate;
}

/* LIVE / GLOW effect — contained INSIDE the real button area */
.hotspot{
  overflow:hidden;
}
.hotspot::before{
  content:"";
  position:absolute;
  inset:2px;
  border-radius:calc(14px - 2px);
  pointer-events:none;
  opacity:.82;
  border:0;
  background:rgba(255,205,76,.025);
  box-shadow:
    inset 0 0 0 1px rgba(255,225,135,.40),
    inset 0 0 10px rgba(255,196,45,.42),
    inset 0 0 22px rgba(255,167,0,.20);
  animation:dgPulse 1.9s ease-in-out infinite;
}
.hotspot::after{
  content:"";
  position:absolute;
  inset:3px;
  border-radius:calc(14px - 3px);
  pointer-events:none;
  background:
    linear-gradient(105deg,
      transparent 0%,
      transparent 38%,
      rgba(255,247,205,.08) 44%,
      rgba(255,247,205,.62) 50%,
      rgba(255,247,205,.08) 56%,
      transparent 62%,
      transparent 100%);
  transform:translateX(-120%);
  animation:dgSweep 2.8s ease-in-out infinite;
  mix-blend-mode:screen;
}
@keyframes dgPulse{
  0%,100%{
    opacity:.58;
    filter:brightness(.95);
    transform:scale(.995);
  }
  50%{
    opacity:1;
    filter:brightness(1.18);
    transform:scale(1);
  }
}
@keyframes dgSweep{
  0%,18%{transform:translateX(-120%);opacity:0}
  30%{opacity:.85}
  55%{transform:translateX(120%);opacity:.72}
  56%,100%{transform:translateX(120%);opacity:0}
}
.hotspot:active::before,
.hotspot:focus-visible::before{
  box-shadow:
    inset 0 0 0 1px rgba(255,239,168,.80),
    inset 0 0 14px rgba(255,210,80,.72),
    inset 0 0 28px rgba(255,165,0,.38);
  opacity:1;
}
@media(hover:hover) and (pointer:fine){
  .hotspot:hover::before{
    box-shadow:
      inset 0 0 0 1px rgba(255,239,168,.75),
      inset 0 0 14px rgba(255,210,80,.68),
      inset 0 0 28px rgba(255,165,0,.34);
    opacity:1;
  }
}

/* Different color accents by service */
.wa::before,.wechat::before{
  box-shadow:inset 0 0 0 1px rgba(94,255,145,.50),inset 0 0 12px rgba(40,240,105,.45),inset 0 0 24px rgba(28,190,82,.20);
}
.tgcs::before,.tgch::before{

.tiktok::before{

.fb::before{

.x::before{

}
