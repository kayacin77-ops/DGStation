function seededRandom(seed){
  let x=Math.sin(seed)*10000; return x-Math.floor(x);

function hourlyPick(list, platformOffset){
  const hourSeed=Math.floor(Date.now()/3600000);
  const pool=[...list], picked=[];
  for(let i=0;i<3 && pool.length;i++){
    const r=seededRandom(hourSeed*97 + platformOffset*31 + i*17);
    const idx=Math.floor(r*pool.length);
    picked.push(pool.splice(idx,1)[0]);
  }
  return picked;
}

const dots=[...document.querySelectorAll('.dot')];
let current=0,timer;
function show(i){
 current=(i+slides.length)%slides.length;
 slides.forEach((s,n)=>s.classList.toggle('active',n===current));
 dots.forEach((d,n)=>d.classList.toggle('active',n===current));
}
function auto(){clearInterval(timer);timer=setInterval(()=>show(current+1),6000)}
document.querySelector('.next').onclick=()=>{show(current+1);auto()};
document.querySelector('.prev').onclick=()=>{show(current-1);auto()};
dots.forEach((d,i)=>d.onclick=()=>{show(i);auto()});
auto();

const galleryImages=[
  "assets/promos/promo1.png",
  "assets/promos/promo2.png",
  "assets/promos/promo3.png"
];
let galleryIndex=0;
const galleryModal=document.getElementById("galleryModal");
const galleryImg=document.getElementById("galleryImg");
const galleryCount=document.getElementById("galleryCount");
function renderGallery(){
  galleryImg.src=galleryImages[galleryIndex];
  galleryCount.textContent=(galleryIndex+1)+" / "+galleryImages.length;
}
document.getElementById("openGallery").addEventListener("click",()=>{
  galleryIndex=0; renderGallery();
  galleryModal.classList.add("open");
  galleryModal.setAttribute("aria-hidden","false");
});
document.getElementById("closeGallery").addEventListener("click",()=>{
  galleryModal.classList.remove("open");
  galleryModal.setAttribute("aria-hidden","true");
});
document.getElementById("galleryPrev").addEventListener("click",()=>{
  galleryIndex=(galleryIndex-1+galleryImages.length)%galleryImages.length; renderGallery();
});
document.getElementById("galleryNext").addEventListener("click",()=>{
  galleryIndex=(galleryIndex+1)%galleryImages.length; renderGallery();
});
galleryModal.addEventListener("click",(e)=>{
  if(e.target===galleryModal){
    galleryModal.classList.remove("open");
    galleryModal.setAttribute("aria-hidden","true");
  }
});
document.addEventListener("keydown",(e)=>{
  if(!galleryModal.classList.contains("open")) return;
  if(e.key==="Escape") document.getElementById("closeGallery").click();
  if(e.key==="ArrowLeft") document.getElementById("galleryPrev").click();
  if(e.key==="ArrowRight") document.getElementById("galleryNext").click();
});



</script>
</body></html>
