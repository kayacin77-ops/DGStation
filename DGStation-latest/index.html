<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>DGStation</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050505;font-family:Arial,sans-serif}
.shell{display:flex;justify-content:center;padding:0}
.page{position:relative;width:min(100%,1536px);margin:auto;overflow:hidden;background:#050505}
.poster{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.hotspot{position:absolute;display:block;background:transparent!important;border:0!important;outline:0!important;box-shadow:none!important;-webkit-tap-highlight-color:transparent}
/* Hotspot social media pada bar bawah — sengaja tanpa glow/pulse/border */
.tiktok{left:1.5%;top:89.0%;width:6.0%;height:9.0%}
.x{left:7.8%;top:89.0%;width:7.2%;height:9.0%}
.fb{left:15.2%;top:89.0%;width:8.0%;height:9.0%}
.tgch{left:23.5%;top:89.0%;width:10.5%;height:9.0%}
.tgcs{left:34.2%;top:89.0%;width:10.0%;height:9.0%}
.wa{left:44.4%;top:89.0%;width:9.0%;height:9.0%}
.wechat{left:53.6%;top:89.0%;width:9.0%;height:9.0%}
@media(max-width:700px){.page{width:100vw}}
</style>
</head>
<body>
<div class="shell">
  <main class="page">
    <img class="poster" src="dgstation-home.png" alt="DGStation">
    <a class="hotspot tiktok" href="https://www.tiktok.com/@hime.chelsia" target="_blank" rel="noopener" aria-label="TikTok"></a>
    <a class="hotspot x" href="https://x.com/dgstation" target="_blank" rel="noopener" aria-label="X"></a>
    <a class="hotspot fb" href="https://www.facebook.com/profile.php?id=61551561516825" target="_blank" rel="noopener" aria-label="Facebook"></a>
    <a class="hotspot tgch" href="https://t.me/dgstation" target="_blank" rel="noopener" aria-label="Telegram Channel"></a>
    <a class="hotspot tgcs" href="https://t.me/dgstation888" target="_blank" rel="noopener" aria-label="Telegram CS"></a>
    <a class="hotspot wa" href="https://wa.me/60168529270" target="_blank" rel="noopener" aria-label="WhatsApp"></a>
    <div class="hotspot wechat" role="link" tabindex="0" title="WeChat ID: Dgstation8" aria-label="WeChat ID Dgstation8"></div>
  </main>
</div>
</body>
</html>
